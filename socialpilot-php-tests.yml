name: SocialPilot Engine PHP Tests

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, simplexml, curl

      - name: Extract Engine
        run: unzip -q SocialPilot_Engine.zip -d engine-src

      - name: Lint PHP
        working-directory: engine-src
        run: find laravel tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Run tests
        working-directory: engine-src
        run: php tests/php/run.php
